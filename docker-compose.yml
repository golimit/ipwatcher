services:
  ipwatcher:
    image: ghcr.io/golimit/ipwatcher:latest
    container_name: ipwatcher
    restart: unless-stopped
    volumes:
      - ./data:/app/data
    environment:
      IPWATCHER_INTERVAL: 5m
      IPWATCHER_TIMEOUT: 5s
      IPWATCHER_RETRIES: "2"
      IPWATCHER_RETRY_DELAY: 2s
      IPWATCHER_DB_PATH: /app/data/ipwatcher.db
      IPWATCHER_LOG_LEVEL: info
      # IPWATCHER_PROVIDERS_V6: "https://ipv6.icanhazip.com,https://api6.ipify.org,https://6.ident.me"
      # IPWATCHER_IGNORE_IPS: "154.3.34.66,154.3.0.0/16"
      # IPWATCHER_WEBHOOK_URL: "https://example.com/hooks/ipwatcher"
