services:
  ipwatcher:
    build:
      context: .
      args:
        VERSION: "0.2.0"
    image: ipwatcher:local
    container_name: ipwatcher
    restart: unless-stopped
    volumes:
      - ./data:/app/data
    environment:
      IPWATCHER_INTERVAL: 5m
      IPWATCHER_TIMEOUT: 5s
      IPWATCHER_RETRIES: "2"
      IPWATCHER_RETRY_DELAY: 2s
      IPWATCHER_DB_PATH: /app/data/ipwatcher.db
      IPWATCHER_LOG_LEVEL: info
      # Prefer CLI for ignore rules (stored in SQLite under ./data/):
      #   docker compose exec ipwatcher ipwatcher ignore add 203.0.113.66
      #   docker compose exec ipwatcher ipwatcher ignore list
      # Secrets via env, never commit real values:
      # IPWATCHER_PROVIDERS_V6: "https://ipv6.icanhazip.com,https://api6.ipify.org,https://6.ident.me"
      # IPWATCHER_WEBHOOK_URL: "https://example.com/hooks/ipwatcher"
