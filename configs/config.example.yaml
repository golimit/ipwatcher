collector:
  interval: 5m
  timeout: 5s
  retries: 2
  retry_delay: 2s

database:
  path: ./data/ipwatcher.db

logging:
  level: info

# IPv4 providers (required). Failover in order.
providers:
  - https://ipv4.icanhazip.com
  - https://api.ipify.org
  - https://4.ident.me

# IPv6 providers (optional). Empty = do not collect IPv6.
# Failures are ignored; only successful lookups are recorded.
providers_v6:
  - https://ipv6.icanhazip.com
  - https://api6.ipify.org
  - https://6.ident.me

# Permanent ignore rules are managed at runtime (stored in SQLite, not this file):
#   ipwatcher ignore list
#   ipwatcher ignore add 203.0.113.66
#   ipwatcher ignore add 203.0.113.0/24
#   ipwatcher purge -cidr 203.0.113.0/24 --also-ignore
# Optional one-off extras (merged with DB rules; do not commit real IPs here):
# ignore_ips: []

# Optional: POST JSON on IP change. Prefer env IPWATCHER_WEBHOOK_URL for secrets.
# notify:
#   webhook_url: https://example.com/hooks/ipwatcher
#   timeout: 5s
